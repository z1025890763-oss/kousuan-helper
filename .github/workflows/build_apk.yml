        package com.kousuan.helper
        import android.accessibilityservice.AccessibilityService
        import android.accessibilityservice.GestureDescription
        import android.graphics.Path
        import android.view.accessibility.AccessibilityEvent
        class KousuanAccessibilityService : AccessibilityService() {
            companion object {
                var instance: KousuanAccessibilityService? = null
                    private set
            }
            override fun onServiceConnected() {
                super.onServiceConnected()
                instance = this
            }
            override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
            override fun onInterrupt() { instance = null }
            override fun onDestroy() { super.onDestroy(); instance = null }
            fun drawGreaterThan(cx: Float, cy: Float, size: Float, strokeDurationMs: Long = 20) {
                val path = Path().apply {
                    moveTo(cx - size, cy - size)
                    lineTo(cx + size, cy)
                    lineTo(cx - size, cy + size)
                }
                dispatchStroke(path, strokeDurationMs)
            }
            fun drawLessThan(cx: Float, cy: Float, size: Float, strokeDurationMs: Long = 20) {
                val path = Path().apply {
                    moveTo(cx + size, cy - size)
                    lineTo(cx - size, cy)
                    lineTo(cx + size, cy + size)
                }
                dispatchStroke(path, strokeDurationMs)
            }
            fun drawEqual(cx: Float, cy: Float, width: Float, height: Float, strokeDurationMs: Long = 15) {
                val path1 = Path().apply {
                    moveTo(cx - width, cy - height)
                    lineTo(cx + width, cy - height)
                }
                val path2 = Path().apply {
                    moveTo(cx - width, cy + height)
                    lineTo(cx + width, cy + height)
                }
                val builder = GestureDescription.Builder()
                builder.addStroke(GestureDescription.StrokeDescription(path1, 0, strokeDurationMs))
                builder.addStroke(GestureDescription.StrokeDescription(path2, strokeDurationMs + 5, strokeDurationMs))
                dispatchGesture(builder.build(), null, null)
            }
            private fun dispatchStroke(path: Path, durationMs: Long) {
                val stroke = GestureDescription.StrokeDescription(path, 0, durationMs)
                val gesture = GestureDescription.Builder().addStroke(stroke).build()
                dispatchGesture(gesture, null, null)
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/kousuan/helper/KousuanSolver.kt
        package com.kousuan.helper
        import java.util.regex.Pattern
        object KousuanSolver {
            fun solve(rawText: String): String? {
                if (rawText.isBlank()) return null
                val text = rawText.replace("\\s+".toRegex(), "")
                    .replace("o", "0", ignoreCase = true)
                    .replace("l", "1", ignoreCase = true)
                    .replace("I", "1")
                    .replace("x", "×", ignoreCase = true)
                val matcher = Pattern.compile("(\\d+)[^0-9]?(\\d+)").matcher(text)
                if (matcher.find()) {
                    val num1 = matcher.group(1)?.toLongOrNull()
                    val num2 = matcher.group(2)?.toLongOrNull()
                    if (num1 != null && num2 != null) {
                        return when {
                            num1 > num2 -> ">"
                            num1 < num2 -> "<"
                            else -> "="
                        }
                    }
                }
                return null
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/kousuan/helper/ScreenCaptureManager.kt
        package com.kousuan.helper
        import android.content.Context
        import android.graphics.Bitmap
        import android.graphics.PixelFormat
        import android.hardware.display.DisplayManager
        import android.hardware.display.VirtualDisplay
        import android.media.ImageReader
        import android.media.projection.MediaProjection
        import android.os.Handler
        import android.os.Looper
        import android.util.DisplayMetrics
        import android.view.WindowManager
        import com.google.mlkit.vision.common.InputImage
        import com.google.mlkit.vision.text.TextRecognition
        import com.google.mlkit.vision.text.latin.TextRecognizerOptions
        class ScreenCaptureManager(private val context: Context) {
            private var mediaProjection: MediaProjection? = null
            private var virtualDisplay: VirtualDisplay? = null
            private var imageReader: ImageReader? = null
            private val recognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
            private var screenWidth = 1080
            private var screenHeight = 2400
            private var screenDensity = 480
            init {
                val wm = context.getSystemService(Context.WINDOW_SERVICE) as WindowManager
                val metrics = DisplayMetrics()
                wm.defaultDisplay.getRealMetrics(metrics)
                screenWidth = metrics.widthPixels
                screenHeight = metrics.heightPixels
                screenDensity = metrics.densityDpi
            }
            fun initProjection(projection: MediaProjection) {
                this.mediaProjection = projection
                imageReader = ImageReader.newInstance(screenWidth, screenHeight, PixelFormat.RGBA_8888, 2)
                virtualDisplay = projection.createVirtualDisplay(
                    "KousuanCapture",
                    screenWidth, screenHeight, screenDensity,
                    DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                    imageReader?.surface, null, Handler(Looper.getMainLooper())
                )
            }
            fun captureQuestionBitmap(): Bitmap? {
                val image = imageReader?.acquireLatestImage() ?: return null
                val planes = image.planes
                val buffer = planes[0].buffer
                val pixelStride = planes[0].pixelStride
                val rowStride = planes[0].rowStride
                val rowPadding = rowStride - pixelStride * screenWidth
                val bitmap = Bitmap.createBitmap(
                    screenWidth + rowPadding / pixelStride,
                    screenHeight,
                    Bitmap.Config.ARGB_8888
                )
                bitmap.copyPixelsFromBuffer(buffer)
                image.close()
                val cropX = (screenWidth * 0.10).toInt()
                val cropY = (screenHeight * 0.18).toInt()
                val cropW = (screenWidth * 0.80).toInt()
                val cropH = (screenHeight * 0.28).toInt()
                return Bitmap.createBitmap(bitmap, cropX, cropY, cropW, cropH)
            }
            fun recognizeText(bitmap: Bitmap, onResult: (String) -> Unit) {
                val inputImage = InputImage.fromBitmap(bitmap, 0)
                recognizer.process(inputImage)
                    .addOnSuccessListener { visionText -> onResult(visionText.text) }
                    .addOnFailureListener { onResult("") }
            }
            fun release() {
                virtualDisplay?.release()
                imageReader?.close()
                mediaProjection?.stop()
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/kousuan/helper/FloatingWindowService.kt
        package com.kousuan.helper
        import android.app.Notification
        import android.app.NotificationChannel
        import android.app.NotificationManager
        import android.app.Service
        import android.content.Context
        import android.content.Intent
        import android.graphics.PixelFormat
        import android.os.Build
        import android.os.Handler
        import android.os.IBinder
        import android.os.Looper
        import android.view.*
        import android.widget.Button
        import android.widget.TextView
        import androidx.core.app.NotificationCompat
        import java.util.concurrent.atomic.AtomicBoolean
        class FloatingWindowService : Service() {
            private lateinit var windowManager: WindowManager
            private lateinit var floatingView: View
            private lateinit var params: WindowManager.LayoutParams
            private var isRunning = AtomicBoolean(false)
            private var solvedCount = 0
            private var strokeSpeedMs = 20L
            private var lastQuestionText = ""
            private val mainHandler = Handler(Looper.getMainLooper())
            private var loopThread: Thread? = null
            companion object {
                var captureManager: ScreenCaptureManager? = null
            }
            override fun onBind(intent: Intent?): IBinder? = null
            override fun onCreate() {
                super.onCreate()
                startForegroundServiceNotification()
                initFloatingWindow()
            }
            private fun startForegroundServiceNotification() {
                val channelId = "kousuan_floating_channel"
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    val channel = NotificationChannel(
                        channelId, "口算助手前台服务",
                        NotificationManager.IMPORTANCE_LOW
                    )
                    val nm = getSystemService(NotificationManager::class.java)
                    nm?.createNotificationChannel(channel)
                }
                val notification: Notification = NotificationCompat.Builder(this, channelId)
                    .setContentTitle("口算秒答助手正在运行")
                    .setContentText("悬浮窗已就绪，点击开始PK")
                    .setSmallIcon(android.R.drawable.ic_media_play)
                    .build()
                startForeground(1001, notification)
            }
            private fun initFloatingWindow() {
                windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                val inflater = LayoutInflater.from(this)
                floatingView = inflater.inflate(R.layout.layout_floating_window, null)
                val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                } else {
                    WindowManager.LayoutParams.TYPE_PHONE
                }
                params = WindowManager.LayoutParams(
                    WindowManager.LayoutParams.WRAP_CONTENT,
                    WindowManager.LayoutParams.WRAP_CONTENT,
                    layoutType,
                    WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                    PixelFormat.TRANSLUCENT
                ).apply {
                    gravity = Gravity.TOP or Gravity.START
                    x = 50
                    y = 200
                }
                windowManager.addView(floatingView, params)
                setupInteractions()
            }
            private fun setupInteractions() {
                val dragBar = floatingView.findViewById<View>(R.id.layoutDragBar)
                val btnToggle = floatingView.findViewById<Button>(R.id.btnToggle)
                val btnSpeed = floatingView.findViewById<Button>(R.id.btnSpeed)
                val btnClose = floatingView.findViewById<Button>(R.id.btnClose)
                val tvSolvedBadge = floatingView.findViewById<TextView>(R.id.tvSolvedBadge)
                val tvStatus = floatingView.findViewById<TextView>(R.id.tvStatus)
                dragBar.setOnTouchListener(object : View.OnTouchListener {
                    private var initialX = 0
                    private var initialY = 0
                    private var initialTouchX = 0f
                    private var initialTouchY = 0f
                    override fun onTouch(v: View?, event: MotionEvent): Boolean {
                        when (event.action) {
                            MotionEvent.ACTION_DOWN -> {
                                initialX = params.x
                                initialY = params.y
                                initialTouchX = event.rawX
                                initialTouchY = event.rawY
                                return true
                            }
                            MotionEvent.ACTION_MOVE -> {
                                params.x = initialX + (event.rawX - initialTouchX).toInt()
                                params.y = initialY + (event.rawY - initialTouchY).toInt()
                                windowManager.updateViewLayout(floatingView, params)
                                return true
                            }
                        }
                        return false
                    }
                })
                btnToggle.setOnClickListener {
                    val running = isRunning.get()
                    isRunning.set(!running)
                    if (!running) {
                        btnToggle.text = "⏸ 暂停"
                        tvStatus.text = "⚡ 极速答题中..."
                        startSolveLoop(tvSolvedBadge, tvStatus)
                    } else {
                        btnToggle.text = "▶ 开始"
                        tvStatus.text = "已暂停"
                    }
                }
                var speedIndex = 0
                val speeds = arrayOf("⚡ 极限", "🚀 极速", "🎯 稳健")
                val strokeTimes = arrayOf(15L, 35L, 80L)
                btnSpeed.setOnClickListener {
                    speedIndex = (speedIndex + 1) % speeds.size
                    btnSpeed.text = speeds[speedIndex]
                    strokeSpeedMs = strokeTimes[speedIndex]
                    tvStatus.text = "切换为: ${speeds[speedIndex]}"
                }
                btnClose.setOnClickListener { stopSelf() }
            }
            private fun startSolveLoop(tvSolvedBadge: TextView, tvStatus: TextView) {
                loopThread?.interrupt()
                loopThread = Thread {
                    val dm = resources.displayMetrics
                    val cx = dm.widthPixels * 0.50f
                    val cy = dm.heightPixels * 0.70f
                    val size = dm.widthPixels * 0.12f
                    while (isRunning.get() && !Thread.currentThread().isInterrupted) {
                        val bitmap = captureManager?.captureQuestionBitmap()
                        if (bitmap != null) {
                            captureManager?.recognizeText(bitmap) { text ->
                                if (text.isNotBlank() && text != lastQuestionText) {
                                    val answer = KousuanSolver.solve(text)
                                    if (answer != null) {
                                        lastQuestionText = text
                                        solvedCount++
                                        val accService = KousuanAccessibilityService.instance
                                        if (accService != null) {
                                            when (answer) {
                                                ">" -> accService.drawGreaterThan(cx, cy, size, strokeSpeedMs)
                                                "<" -> accService.drawLessThan(cx, cy, size, strokeSpeedMs)
                                                "=" -> accService.drawEqual(cx, cy, size, size * 0.4f, strokeSpeedMs)
                                            }
                                        }
                                        mainHandler.post {
                                            tvSolvedBadge.text = " [$solvedCount 题]"
                                            tvStatus.text = "答: $text -> $answer"
                                        }
                                    }
                                }
                            }
                        }
                        try {
                            Thread.sleep(15)
                        } catch (e: InterruptedException) {
                            break
                        }
                    }
                }.apply { start() }
            }
            override fun onDestroy() {
                isRunning.set(false)
                loopThread?.interrupt()
                if (::floatingView.isInitialized) {
                    windowManager.removeView(floatingView)
                }
                captureManager?.release()
                super.onDestroy()
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/kousuan/helper/MainActivity.kt
        package com.kousuan.helper
        import android.app.Activity
        import android.content.Context
        import android.content.Intent
        import android.media.projection.MediaProjectionManager
        import android.net.Uri
        import android.os.Build
        import android.os.Bundle
        import android.provider.Settings
        import android.widget.Button
        import android.widget.Toast
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.appcompat.app.AppCompatActivity
        class MainActivity : AppCompatActivity() {
            private lateinit var btnPermOverlay: Button
            private lateinit var btnPermAcc: Button
            private lateinit var btnStartHelper: Button
            private val screenCaptureLauncher = registerForActivityResult(
                ActivityResultContracts.StartActivityForResult()
            ) { result ->
                if (result.resultCode == Activity.RESULT_OK && result.data != null) {
                    val mpManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                    val projection = mpManager.getMediaProjection(result.resultCode, result.data!!)
                    val captureManager = ScreenCaptureManager(this)
                    captureManager.initProjection(projection)
                    FloatingWindowService.captureManager = captureManager
                    val serviceIntent = Intent(this, FloatingWindowService::class.java)
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                        startForegroundService(serviceIntent)
                    } else {
                        startService(serviceIntent)
                    }
                    Toast.makeText(this, "⚡ 秒答悬浮窗已开启！请进入小猿口算", Toast.LENGTH_LONG).show()
                    finish()
                } else {
                    Toast.makeText(this, "需要授予截屏权限才能识别题目！", Toast.LENGTH_SHORT).show()
                }
            }
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)
                btnPermOverlay = findViewById(R.id.btnPermOverlay)
                btnPermAcc = findViewById(R.id.btnPermAcc)
                btnStartHelper = findViewById(R.id.btnStartHelper)
                btnPermOverlay.setOnClickListener {
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                        val intent = Intent(
                            Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                            Uri.parse("package:$packageName")
                        )
                        startActivity(intent)
                    }
                }
                btnPermAcc.setOnClickListener {
                    val intent = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                    startActivity(intent)
                }
                btnStartHelper.setOnClickListener {
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                        Toast.makeText(this, "请先开启【悬浮窗权限】", Toast.LENGTH_SHORT).show()
                        return@setOnClickListener
                    }
                    if (KousuanAccessibilityService.instance == null) {
                        Toast.makeText(this, "请先开启【无障碍服务】", Toast.LENGTH_SHORT).show()
                        return@setOnClickListener
                    }
                    val mpManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                    screenCaptureLauncher.launch(mpManager.createScreenCaptureIntent())
                }
            }
            override fun onResume() {
                super.onResume()
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && Settings.canDrawOverlays(this)) {
                    btnPermOverlay.text = "已开启 ✓"
                    btnPermOverlay.isEnabled = false
                }
                if (KousuanAccessibilityService.instance != null) {
                    btnPermAcc.text = "已开启 ✓"
                    btnPermAcc.isEnabled = false
                }
            }
        }
        EOF

        # 编译 Debug APK
        gradle assembleDebug --no-daemon

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: KousuanHelper-Release-APK
        path: app/build/outputs/apk/debug/*.apk
